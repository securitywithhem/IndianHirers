# CI for the Indian Hirers site. Vercel holds each production deployment until the
# "Quality gate" job passes, so renaming that job means updating the Deployment
# Check in the Vercel project too. Full picture: indian-hires-website/docs/CI_CD.md
name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Public contact details, so the checks see a populated site. Production values
# live in Vercel; these never reach a deployment.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_PHONE: "+918734090908"
  NEXT_PUBLIC_PHONE_ALT: "+919825037478"
  NEXT_PUBLIC_PHONE_JAY: "+919925515029"
  NEXT_PUBLIC_WHATSAPP: "918734090908"
  NEXT_PUBLIC_EMAIL: "indianhires@gmail.com"
  NEXT_PUBLIC_SITE_URL: "https://indian-hirers.vercel.app"
  BASE_URL: "http://localhost:3101"

defaults:
  run:
    shell: bash
    working-directory: indian-hires-website

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: indian-hires-website/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('indian-hires-website/package-lock.json') }}-${{ hashFiles('indian-hires-website/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('indian-hires-website/package-lock.json') }}-

      - name: Catalogue tests
        run: npm run test:catalogue

      - name: Verify (lint → typecheck → build → check-tokens)
        # Fetching Google Fonts from CI runners fails now and then, crashing next/font.
        # Retry that one error so it cannot hold a release; anything else fails at once.
        run: |
          if ! npm run verify 2>&1 | tee verify.log; then
            grep -q 'An error occurred in `next/font`' verify.log || exit 1
            echo "::warning::next/font failed fetching Google Fonts; retrying once"
            sleep 20
            npm run verify 2>&1 | tee verify.log
          fi

      - name: First Load JS budgets
        run: npm run check:budgets -- verify.log

      - name: Start the production build
        run: |
          npx next start -p 3101 &
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-delay 1 --output /dev/null "$BASE_URL"

      - name: Smoke test
        run: npm run smoke -- "$BASE_URL"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe)
        run: node scripts/audit.mjs axe "$BASE_URL"
        env:
          AUDIT_STRICT: "1"
          AUDIT_OUT: ci-audit

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-gate
          path: |
            indian-hires-website/verify.log
            indian-hires-website/ci-audit/
          retention-days: 14
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Block new high-severity dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The next two report without blocking. A newly published advisory says nothing
  # about the change under test, so it must not hold an unrelated release.
  audit:
    name: Dependency audit (report)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Shared runners are too noisy to gate on these scores, so the 95 target is
  # still confirmed per docs/QA_LOOP.md; this shows the trend on every change.
  lighthouse:
    name: Lighthouse mobile (report)
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        # Report only, so a plain retry is enough for the Google Fonts flake (see the gate).
        run: npm run build || { sleep 20; npm run build; }

      - name: Start the production build
        run: |
          npx next start -p 3101 &
          curl --silent --show-error --fail --retry 30 --retry-connrefused --retry-delay 1 --output /dev/null "$BASE_URL"

      - name: Lighthouse
        run: node scripts/audit.mjs lighthouse "$BASE_URL"
        env:
          LH_PRESETS: mobile
          AUDIT_OUT: ci-audit

      - name: Write the job summary
        run: |
          {
            echo "### Lighthouse mobile (one run, shared CI runner)"
            echo "| Route | Perf | A11y | LCP | CLS |"
            echo "|---|---:|---:|---:|---:|"
            node -e '
              const rows = JSON.parse(require("fs").readFileSync("ci-audit/lighthouse-summary.json", "utf8"));
              for (const r of rows) console.log(r.error ? `| ${r.route} | error | | | |` : `| ${r.route} | ${r.perf} | ${r.a11y} | ${r.lcp} | ${r.cls} |`);
            '
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: indian-hires-website/ci-audit/
          retention-days: 14
          if-no-files-found: ignore
