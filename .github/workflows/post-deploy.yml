# Checks the live site: after every promotion to production, once a day, and on demand.
# A failure here means the public site is wrong now. Runbook: indian-hires-website/docs/CI_CD.md
name: Production smoke

on:
  repository_dispatch:
    types: ["vercel.deployment.promoted"]
  schedule:
    - cron: "30 1 * * *" # 07:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Set the PRODUCTION_URL repository variable once the real domain is live.
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://indian-hirers.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: indian-hires-website/.nvmrc

      - name: Smoke test
        working-directory: indian-hires-website
        run: node scripts/smoke.mjs "$PRODUCTION_URL"
