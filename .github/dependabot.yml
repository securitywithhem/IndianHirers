version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /indian-hires-website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Majors (Next, React, Tailwind) are planned work with their own QA loop.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
